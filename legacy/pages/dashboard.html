<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Center · PLOGME</title><link rel="stylesheet" href="/public.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="manifest" href="/public/manifest.webmanifest"><meta name="theme-color" content="#080810"></head><body><div class="route-blur" id="route-blur"></div><div class="layout"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">⚉</span>PLOGME<em>CONTROL CENTER</em></a><a class="btn" href="/">Return home</a></nav><main class="page-enter"><section class="hero"><div class="eyebrow">/ operator workspace</div><h1>Your <span>control center.</span></h1><p>Track your submissions, published plugins, AI conversations, and platform activity from one quiet workspace.</p></section><section id="dashboard-grid" class="grid"><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">search</div><h2>Find across PLOGME</h2></div></div><form class="form" onsubmit="searchPlogme(event)"><input id="search" placeholder="Search plugins, guides, services..."><button class="btn primary">Search</button></form><div id="results" class="grid"></div></section></main><footer class="footer"><a href="/status">System status</a> · <a href="/plugins">Plugin marketplace</a></footer></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const r=await fetch('/api/dashboard');if(r.status===401){location.href='/auth/github?returnTo=/dashboard';return}const d=await r.json();document.getElementById('dashboard-grid').innerHTML=`<article class="card"><small>IDENTITY</small><h3>${esc(d.user.displayName)}</h3><p>@${esc(d.user.login)} · ${esc(d.user.role)}</p></article><article class="card"><small>SUBMISSIONS</small><h3>${d.submissions}</h3><p>Plugin and community submissions</p></article><article class="card"><small>PUBLISHED</small><h3>${d.publishedPlugins}</h3><p>Approved extensions in the marketplace</p></article><article class="card"><small>AI CONVERSATIONS</small><h3>${d.aiConversations}</h3><p>Your saved support sessions</p></article>`}async function searchPlogme(e){e.preventDefault();const q=document.getElementById('search').value.trim();if(!q)return;const r=await fetch('/api/search?q='+encodeURIComponent(q));const rows=await r.json();document.getElementById('results').innerHTML=rows.length?rows.map(x=>`<a class="card" href="${esc(x.url||'/plugins')}"><small>${esc(x.type)}</small><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p></a>`).join(''):'<div class="card"><h3>No results</h3><p>Try another search term.</p></div>'}load();</script><script>const b=document.getElementById('route-blur');document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a&&a.origin===location.origin&&!a.target)b.classList.add('active')});</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/public/sw.js").catch(()=>{});</script></body></html>
