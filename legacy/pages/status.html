<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status · PLOGME</title><link rel="stylesheet" href="/public.css"><link rel="manifest" href="/public/manifest.webmanifest"><meta name="theme-color" content="#080810"></head><body><div class="route-blur" id="route-blur"></div><div class="layout"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">⚉</span>PLOGME<em>STATUS</em></a><a class="btn" href="/">Return home</a></nav><main class="page-enter"><section class="hero"><div class="eyebrow">/ live systems</div><h1>Everything <span>connected.</span></h1><p>Realtime checks for the services behind the PLOGME ecosystem.</p></section><section id="status-grid" class="grid"></section></main><footer class="footer"><a href="/services">Explore services</a> · <a href="/community">Community</a></footer></div><script>const services=[['PLOGME website','/health'],['CODY AI support','/api/ai-chat/stream'],['Plugin marketplace','/api/plugins'],['Pair console','/pair'],['Ban Check API','/api/bancheck?phone=2348077528901']];async function run(){const out=[];for(const [name,url] of services){const t=performance.now();try{const r=await fetch(url,{method:url.includes('stream')?'POST':'GET',headers:url.includes('stream')?{'content-type':'application/json'}:{},body:url.includes('stream')?JSON.stringify({message:'status check',history:[]}):undefined});out.push({name,ok:r.ok,latency:Math.round(performance.now()-t)})}catch{out.push({name,ok:false,latency:0})}}document.getElementById('status-grid').innerHTML=out.map(x=>`<article class="card"><span class="badge ${x.ok?'status-ok':'status-bad'}">${x.ok?'OPERATIONAL':'DEGRADED'}</span><h3>${x.name}</h3><p>${x.ok?`Responding in ${x.latency}ms`:'Service needs attention'}</p></article>`).join('')}run();</script><script>const b=document.getElementById('route-blur');document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a&&a.origin===location.origin&&!a.target)b.classList.add('active')});</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/public/sw.js").catch(()=>{});</script></body></html>
