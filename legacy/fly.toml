# fly.toml app configuration file generated for cody-pairc2582 on 2026-05-27T12:34:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cody-pairc2582'
primary_region = 'cdg'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
